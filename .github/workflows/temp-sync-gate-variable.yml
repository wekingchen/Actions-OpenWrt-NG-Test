name: Temporary P0 Transition Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-sync-gate-variable.yml"

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 取消旧构建并删除 helper
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_RUN_ID: "37218272739"
        run: |
          set -Eeuo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$OLD_RUN_ID/cancel" || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-sync-gate-variable.yml
          git commit -m "chore: remove temporary P0 transition helper"
          git push origin HEAD:main
