name: Restart gl-mt3600be on synced main

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restart-gl-mt3600be-synced.yml"

permissions:
  actions: write
  contents: write

jobs:
  restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 取消旧回归并清理临时工作流
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_RUN_ID: "37204748931"
        run: |
          set -Eeuo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$OLD_RUN_ID/cancel" || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restart-gl-mt3600be-synced.yml
          git commit -m "chore: remove synced gl-mt3600be restart helper"
          git push origin HEAD:main

      - name: 从最新 main 重新触发 gl-mt3600be
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for i in {1..20}; do
            latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
            current="$(git rev-parse HEAD)"
            if [ "$latest" != "$current" ]; then
              break
            fi
            sleep 1
          done

          gh api -X POST             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/actions/workflows/build-openwrt.yml/dispatches"             -f ref=main             -f 'inputs[profile]=gl-mt3600be'             -f 'inputs[publish_release]=false'             -f 'inputs[control_plane_request_id]=synced-main-regression'

          echo "已从最新 main 触发 gl-mt3600be 回归。"
