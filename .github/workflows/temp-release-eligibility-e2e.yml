name: Temporary Release Eligibility E2E
on:
  push:
    branches: [main]
    paths: [".github/workflows/temp-release-eligibility-e2e.yml"]
permissions:
  actions: read
  contents: write
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Self clean first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-release-eligibility-e2e.yml
          git commit -m "chore: remove Release eligibility E2E helper"
          git push origin HEAD:main
      - name: Install deps
        working-directory: control-plane
        run: npm ci --ignore-scripts
      - name: Verify current Release Existing eligibility guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { GitHubAppClient } from "./control-plane/lib/github.mjs";
          const c=new GitHubAppClient({clientId:"e2e",clientSecret:"e2e",redirectUri:"https://invalid.local/",profileMergePolicy:"immediate"});
          try {
            await c.triggerReleaseExisting(process.env.GH_TOKEN,"wekingchen","Actions-OpenWrt-NG-Test",37254811453);
            throw new Error("ineligible release recovery unexpectedly accepted");
          } catch(e) {
            if(e?.code!=="release_bundle_missing") throw e;
            console.log("RELEASE_ELIGIBILITY_GUARD_OK="+e.code);
          }
          NODE
