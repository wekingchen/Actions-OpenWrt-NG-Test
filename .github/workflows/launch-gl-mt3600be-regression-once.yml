name: Launch gl-mt3600be regression and cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/launch-gl-mt3600be-regression-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  launch-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: 触发 gl-mt3600be Ubuntu 24 回归构建
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api             -X POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/build-openwrt.yml/dispatches"             --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "profile": "gl-mt3600be",
              "publish_release": "false",
              "control_plane_request_id": "gn-ubuntu24-regression"
            }
          }
          JSON

      - name: 删除已合并 Test 修复分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api -X DELETE             "repos/${GITHUB_REPOSITORY}/git/refs/heads/fix/ubuntu24-build-cache-abi"             --silent || true

      - name: 检出 main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 删除一次性 Workflow
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/launch-gl-mt3600be-regression-once.yml"
          git commit -m "chore: remove gl-mt3600be regression helper"
          git push origin HEAD:main
