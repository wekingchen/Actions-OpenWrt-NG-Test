name: Cancel stale gl-mt3600be regression

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cancel-stale-gl-mt3600be-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  cancel-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: 取消旧 build-v2 回归 #10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api -X POST             "repos/${GITHUB_REPOSITORY}/actions/runs/37190257245/cancel"             --silent || true

      - name: 检出 main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 删除一次性 Workflow
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/cancel-stale-gl-mt3600be-once.yml"
          git commit -m "chore: remove stale regression cancel helper"
          git push origin HEAD:main
