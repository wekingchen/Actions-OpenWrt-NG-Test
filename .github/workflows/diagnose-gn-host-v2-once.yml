name: Diagnose helloworld GN host v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-gn-host-v2-once.yml"

permissions:
  contents: write

jobs:
  diagnose:
    name: GN host v2 · ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: 检出 Test 仓
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: 同步主仓运行时
        run: |
          set -Eeuo pipefail
          runtime="$RUNNER_TEMP/openwrt-ng-runtime"
          git clone --depth=1 --branch main https://github.com/wekingchen/Actions-OpenWrt-NG.git "$runtime"
          rm -rf scripts adapters
          cp -a "$runtime/scripts" scripts
          cp -a "$runtime/adapters" adapters

      - name: 安装 Host 编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y             build-essential clang gawk gettext git libncurses-dev             ninja-build python3 rsync unzip wget zlib1g-dev
          echo "=== Host toolchain ==="
          gcc --version | head -n1
          g++ --version | head -n1
          clang --version | head -n1 || true
          clang++ --version | head -n1 || true

      - name: 加载 gl-mt3600be Profile
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh adapters/*.sh
          scripts/profile.sh validate gl-mt3600be
          scripts/profile.sh export gl-mt3600be

      - name: 准备与正式 Builder 相同的源码和 Feeds
        run: |
          set -Eeuo pipefail
          "$ADAPTER_SCRIPT" install-deps
          "$ADAPTER_SCRIPT" prepare
          if [ -n "${DIY_PART1:-}" ]; then
            (cd openwrt && bash "$DIY_PART1")
          fi
          scripts/apply-extra-feeds.sh "$GITHUB_WORKSPACE/openwrt" "$EXTRA_FEEDS_FILE"
          (cd openwrt && ./scripts/feeds update -a)
          if [ -n "${POST_FEEDS_SCRIPT:-}" ]; then
            (cd openwrt && bash "$POST_FEEDS_SCRIPT")
          fi
          bash scripts/install-feeds.sh "$GITHUB_WORKSPACE/openwrt" "$RUNNER_TEMP/openwrt-ng-feeds-install.log"

      - name: 恢复 Profile 配置并 make defconfig
        run: |
          set -Eeuo pipefail
          cp "$CONFIG_FILE" openwrt/.config
          if [ -n "${PROFILE_FILES_DIR:-}" ] && [ -d "$PROFILE_FILES_DIR" ]; then
            rm -rf openwrt/files
            cp -a "$PROFILE_FILES_DIR" openwrt/files
          fi
          if [ -n "${DIY_PART2:-}" ]; then
            (cd openwrt && bash "$DIY_PART2")
          fi
          (
            cd openwrt
            unset FILES_DIR
            make defconfig
          )

      - name: 只编译 helloworld GN host
        run: |
          set -o pipefail
          cd openwrt
          echo "=== GN feed metadata ==="
          sed -n '1,80p' package/feeds/helloworld/gn/Makefile
          echo "=== GN patches ==="
          find package/feeds/helloworld/gn/patches -maxdepth 1 -type f -printf '%f\n' | sort || true
          echo "=== 开始单独编译 GN host ==="
          make package/feeds/helloworld/gn/host/clean >/dev/null 2>&1 || true
          make package/feeds/helloworld/gn/host/compile -j1 V=s 2>&1 | tee "$RUNNER_TEMP/gn-host-v2-${{ matrix.runner }}.log"

      - name: 上传 GN 诊断日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gn-host-v2-${{ matrix.runner }}
          path: ${{ runner.temp }}/gn-host-v2-${{ matrix.runner }}.log
          if-no-files-found: warn
          retention-days: 3

  cleanup:
    name: 清理一次性 GN 诊断 Workflow v2
    if: always()
    needs: diagnose
    runs-on: ubuntu-24.04
    steps:
      - name: 检出 main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 删除自身
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/diagnose-gn-host-v2-once.yml"
          git commit -m "chore: remove GN host v2 diagnostic helper"
          git push origin HEAD:main
