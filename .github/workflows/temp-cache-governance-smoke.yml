name: Temporary Cache Governance Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-cache-governance-smoke.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 删除 helper 并从干净 main 触发 smoke
        env:
          GH_TOKEN: ${{ github.token }}
          HELPER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-cache-governance-smoke.yml
          git commit -m "chore: remove cache governance smoke helper"
          git push origin HEAD:main

          clean_sha=""
          for _ in $(seq 1 30); do
            clean_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            if [ -n "$clean_sha" ] && [ "$clean_sha" != "$HELPER_SHA" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$clean_sha" ] || [ "$clean_sha" = "$HELPER_SHA" ]; then
            echo "ERROR: 未观察到 helper 自删除后的 main" >&2
            exit 1
          fi

          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build-openwrt.yml/dispatches" \
            -f ref=main \
            -F inputs[profile]=smoke \
            -F inputs[publish_release]=false \
            -F inputs[control_plane_request_id]=cache-governance-validation

          echo "已从 clean main 触发 smoke：$clean_sha"
