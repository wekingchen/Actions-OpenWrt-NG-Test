name: Temporary dispatch ccache v2 seed build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/_tmp-dispatch-ccache-v2-seed.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: 排队 ccache v2 种子构建
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          body='{"ref":"main","inputs":{"profile":"default","publish_release":"false","control_plane_request_id":"ccachev2seed"}}'
          status="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             -d "$body"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-openwrt.yml/dispatches")"
          if [ "$status" != "204" ]; then
            cat /tmp/dispatch.json >&2 || true
            echo "触发种子构建失败，HTTP $status" >&2
            exit 1
          fi
          echo "已排队 ccache v2 种子构建"
