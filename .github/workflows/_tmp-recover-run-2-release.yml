name: Temporary recover failed release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/_tmp-recover-run-2-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: 触发 Run #2 恢复发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          body='{"ref":"main","inputs":{"run_id":"37101575101"}}'
          status="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             -d "$body"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release-existing.yml/dispatches")"
          if [ "$status" != "204" ]; then
            cat /tmp/dispatch.json >&2 || true
            echo "触发恢复发布失败，HTTP $status" >&2
            exit 1
          fi
          echo "已触发 Run #2 恢复发布"
