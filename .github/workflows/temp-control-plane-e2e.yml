name: Temporary Control Plane E2E
on:
  push:
    branches: [main]
    paths: [".github/workflows/temp-control-plane-e2e.yml"]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run E2E
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_SUFFIX: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { GitHubAppClient } from "./control-plane/lib/github.mjs";

          const token = process.env.GH_TOKEN;
          const owner = "wekingchen";
          const repo = "Actions-OpenWrt-NG-Test";
          const source = "smoke";
          const suffix = String(process.env.E2E_SUFFIX).slice(-8);
          const copyId = "e2e-copy-" + suffix;
          const renamedId = "e2e-renamed-" + suffix;
          const active = new Set(["queued","in_progress","pending","waiting","requested"]);
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const client = new GitHubAppClient({
            clientId: "e2e",
            clientSecret: "e2e",
            redirectUri: "https://invalid.local/",
            profileMergePolicy: "immediate"
          });
          const report = {
            startedAt: new Date().toISOString(),
            success: false,
            source,
            copyId,
            renamedId,
            steps: {},
            cleanup: {}
          };
          function err(e) {
            return {
              code: e?.code || "",
              status: Number(e?.status || e?.httpStatus || 0),
              message: String(e?.message || e || "")
            };
          }
          async function rec(name, fn, pick) {
            const t = Date.now();
            try {
              const v = await fn();
              report.steps[name] = {ok:true, ms:Date.now()-t, result:pick ? pick(v) : v};
              return v;
            } catch (e) {
              report.steps[name] = {ok:false, ms:Date.now()-t, error:err(e)};
              throw e;
            }
          }
          async function workflowRun(file, phrase, after) {
            for (let i=0;i<60;i++) {
              const b = await client.api("/repos/"+owner+"/"+repo+"/actions/workflows/"+file+"/runs?per_page=50", token);
              const runs = Array.isArray(b?.workflow_runs) ? b.workflow_runs : [];
              const x = runs.find((r) => (Date.parse(r.created_at||"")||0) >= after-5000 &&
                String(r.display_title||r.name||"").includes(phrase));
              if (x) return x;
              await sleep(2000);
            }
            return null;
          }
          async function poll(getter, id, count=120, ms=2500) {
            let v=null;
            for (let i=0;i<count;i++) {
              v = await getter(id);
              if (v?.status === "completed") return v;
              await sleep(ms);
            }
            return v;
          }

          let originalBaseline = "";
          let builderId = 0;
          try {
            const initial = await rec("profile.initial", () => client.listProfiles(token,owner,repo),
              (x) => x.map((p)=>({id:p.id, baseline:p.baseline})));
            originalBaseline = initial.find((p)=>p.baseline)?.id || "";
            if (!originalBaseline) throw new Error("No baseline");

            let state = await client.repositoryState(token,owner,repo);
            const cp = await rec("profile.copy",
              () => client.copyProfilePullRequest(token,owner,repo,source,{baseRefSha:state.baseRefSha,targetProfileId:copyId}),
              (r)=>({merged:r.pullRequest?.merged,pr:r.pullRequest?.number,branchDeleted:r.cleanup?.branchDeleted}));
            if (!cp.pullRequest?.merged) throw new Error("copy merge failed");

            const cs = await rec("config-studio.start",
              () => client.startConfigStudio(token,owner,repo,{profileId:copyId}),
              (r)=>({requestId:r.requestId,runId:r.runId,branch:r.branch}));
            await sleep(4000);

            state = await client.repositoryState(token,owner,repo);
            const rn = await rec("profile.rename",
              () => client.renameProfilePullRequest(token,owner,repo,copyId,{baseRefSha:state.baseRefSha,targetProfileId:renamedId}),
              (r)=>({merged:r.pullRequest?.merged,pr:r.pullRequest?.number,sessionCleanup:r.configStudioCleanup}));
            if (!rn.pullRequest?.merged) throw new Error("rename merge failed");
            if ((rn.configStudioCleanup?.sessionsFound||0) < 1 || (rn.configStudioCleanup?.branchesDeleted||0) < 1)
              throw new Error("Config Studio cleanup not observed");

            state = await client.repositoryState(token,owner,repo);
            const sb = await rec("profile.set-baseline",
              () => client.setBaselineProfilePullRequest(token,owner,repo,renamedId,{baseRefSha:state.baseRefSha}),
              (r)=>({merged:r.pullRequest?.merged,pr:r.pullRequest?.number}));
            if (!sb.pullRequest?.merged) throw new Error("set baseline merge failed");

            await rec("profile.protected-delete", async () => {
              const s = await client.repositoryState(token,owner,repo);
              try {
                await client.deleteProfilePullRequest(token,owner,repo,renamedId,{baseRefSha:s.baseRefSha});
              } catch (e) {
                if (e?.code === "protected_profile") return {rejected:true,code:e.code};
                throw e;
              }
              throw new Error("protected delete accepted");
            });

            state = await client.repositoryState(token,owner,repo);
            const rb = await rec("profile.reset-baseline",
              () => client.setBaselineProfilePullRequest(token,owner,repo,originalBaseline,{baseRefSha:state.baseRefSha}),
              (r)=>({merged:r.pullRequest?.merged,pr:r.pullRequest?.number}));
            if (!rb.pullRequest?.merged) throw new Error("reset baseline merge failed");

            state = await client.repositoryState(token,owner,repo);
            const del = await rec("profile.delete",
              () => client.deleteProfilePullRequest(token,owner,repo,renamedId,{baseRefSha:state.baseRefSha}),
              (r)=>({merged:r.pullRequest?.merged,pr:r.pullRequest?.number}));
            if (!del.pullRequest?.merged) throw new Error("delete merge failed");

            const deleted = await rec("profile.deleted-list",
              () => client.listDeletedProfiles(token,owner,repo,{limit:30}),
              (x)=>x.filter((v)=>v.id===renamedId));
            const tomb = deleted.find((v)=>v.id===renamedId);
            if (!tomb?.deletionCommitSha) throw new Error("delete snapshot not found");

            const restore = await rec("profile.restore",
              () => client.restoreDeletedProfilePullRequest(token,owner,repo,renamedId,{deletionCommitSha:tomb.deletionCommitSha}),
              (r)=>({merged:r.pullRequest?.merged,pr:r.pullRequest?.number,changedFiles:r.changedFiles}));
            if (!restore.pullRequest?.merged) throw new Error("restore merge failed");

            state = await client.repositoryState(token,owner,repo);
            const clean = await rec("profile.final-delete",
              () => client.deleteProfilePullRequest(token,owner,repo,renamedId,{baseRefSha:state.baseRefSha}),
              (r)=>({merged:r.pullRequest?.merged,pr:r.pullRequest?.number}));
            if (!clean.pullRequest?.merged) throw new Error("final delete failed");

            const updateAt = Date.now();
            const upd = await rec("update.dispatch-force",
              () => client.triggerUpdateChecker(token,owner,repo,{profileId:source,force:true}),
              (r)=>({accepted:r.accepted,runId:r.runId,runUrl:r.runUrl}));
            let updateId = Number(upd.runId||0);
            if (!updateId) {
              const x = await workflowRun("update-checker.yml","profile:"+source,updateAt);
              updateId = Number(x?.id||0);
            }
            if (!updateId) throw new Error("update run not found");

            const updDone = await rec("update.complete",
              () => poll((id)=>client.getUpdateCheckerRun(token,owner,repo,id),updateId,150,2500),
              (r)=>({status:r?.status,conclusion:r?.conclusion,runId:updateId}));
            if (updDone?.status!=="completed" || updDone?.conclusion!=="success")
              throw new Error("update checker failed");

            let builder = null;
            for (let i=0;i<60 && !builder;i++) {
              const runs = await client.listBuilderRuns(token,owner,repo,{profileId:source,limit:30});
              builder = runs.find((r)=>(Date.parse(r.createdAt||"")||0)>=updateAt-5000 &&
                r.event==="repository_dispatch" && active.has(r.status));
              if (!builder) await sleep(2000);
            }
            if (!builder?.id) throw new Error("builder from update not found");
            builderId = Number(builder.id);

            await rec("builder.cancel",()=>client.cancelBuilderRun(token,owner,repo,builderId),
              (r)=>({accepted:r.accepted,runId:r.runId,runNumber:r.runNumber}));
            const canceled = await rec("builder.cancel-confirm",
              ()=>poll((id)=>client.getBuilderRun(token,owner,repo,id),builderId,80,2500),
              (r)=>({status:r?.status,conclusion:r?.conclusion,attempt:r?.runAttempt,runNumber:r?.runNumber}));
            if (canceled?.status!=="completed") throw new Error("cancel did not complete");

            const rr = await rec("builder.rerun",()=>client.rerunBuilderRun(token,owner,repo,builderId),
              (r)=>({accepted:r.accepted,nextAttempt:r.nextAttempt,runId:r.runId}));
            if (!rr.accepted || Number(rr.nextAttempt||0)<2) throw new Error("rerun not accepted");

            let seen = null;
            for (let i=0;i<80;i++) {
              const cur = await client.getBuilderRun(token,owner,repo,builderId);
              if (Number(cur.runAttempt||1)>=2 && active.has(cur.status)) { seen=cur; break; }
              await sleep(2500);
            }
            if (!seen) throw new Error("rerun attempt not active");
            report.steps["builder.rerun-confirm"]={ok:true,result:{runId:builderId,attempt:seen.runAttempt,status:seen.status}};

            await rec("builder.cancel-rerun",()=>client.cancelBuilderRun(token,owner,repo,builderId),
              (r)=>({accepted:r.accepted,runId:r.runId}));
            const rrDone = await poll((id)=>client.getBuilderRun(token,owner,repo,id),builderId,80,2500);
            report.steps["builder.rerun-final"]={ok:rrDone?.status==="completed",
              result:{status:rrDone?.status,conclusion:rrDone?.conclusion,attempt:rrDone?.runAttempt}};

            const history = await client.listBuilderRuns(token,owner,repo,{limit:30});
            let src = null;
            for (const c of history) {
              if (Number(c.id)===builderId || c.status!=="completed") continue;
              try {
                const d = await client.getBuilderRun(token,owner,repo,c.id);
                if (d.releaseRecoveryEligible) { src=d; break; }
              } catch {}
            }
            if (!src) {
              report.steps["release-existing"]={ok:false,skipped:true,reason:"no_eligible_source"};
            } else {
              const releaseAt=Date.now();
              const rd=await rec("release.dispatch",()=>client.triggerReleaseExisting(token,owner,repo,src.id),
                (r)=>({accepted:r.accepted,sourceRunId:src.id,sourceRunNumber:src.runNumber,runId:r.runId}));
              let rid=Number(rd.runId||0);
              if (!rid) {
                const x=await workflowRun("release-existing.yml","source:"+src.id,releaseAt);
                rid=Number(x?.id||0);
              }
              if (!rid) throw new Error("release run not found");
              const done=await rec("release.complete",
                ()=>poll((id)=>client.getReleaseExistingRun(token,owner,repo,id),rid,120,2500),
                (r)=>({status:r?.status,conclusion:r?.conclusion,runId:rid}));
              if (done?.status!=="completed" || done?.conclusion!=="success") throw new Error("release existing failed");
              const verify=await client.getBuilderRun(token,owner,repo,src.id);
              report.steps["release.verify"]={ok:Boolean(verify.release?.recovered),
                result:{sourceRunId:src.id,sourceRunNumber:src.runNumber,release:verify.release}};
              if (verify.release?.tag) {
                const rels=await client.api("/repos/"+owner+"/"+repo+"/releases?per_page=100",token);
                const rel=Array.isArray(rels)?rels.find((x)=>x?.tag_name===verify.release.tag):null;
                if (rel?.id) await client.api("/repos/"+owner+"/"+repo+"/releases/"+rel.id,token,{method:"DELETE"});
                try {
                  await client.api("/repos/"+owner+"/"+repo+"/git/refs/tags/"+encodeURIComponent(verify.release.tag),token,{method:"DELETE"});
                } catch(e) { if (e?.httpStatus!==404) throw e; }
                report.steps["release.cleanup"]={ok:true,result:{tag:verify.release.tag}};
              }
            }
            report.success=Object.values(report.steps).every((s)=>s?.ok===true || s?.skipped===true);
          } catch(e) {
            report.fatalError=err(e);
          } finally {
            try {
              const ps=await client.listProfiles(token,owner,repo);
              const b=ps.find((p)=>p.baseline)?.id||"";
              if (originalBaseline && b!==originalBaseline) {
                const s=await client.repositoryState(token,owner,repo);
                const r=await client.setBaselineProfilePullRequest(token,owner,repo,originalBaseline,{baseRefSha:s.baseRefSha});
                report.cleanup.baselineReset=Boolean(r.pullRequest?.merged);
              }
            } catch(e) { report.cleanup.baselineResetError=err(e); }

            for (const id of [copyId,renamedId]) {
              try { await client.cleanupConfigStudioSessionsForProfile(token,owner,repo,id); } catch(e) {}
              try {
                const p=await client.getProfile(token,owner,repo,id);
                if (!p.profile.baseline) {
                  const r=await client.deleteProfilePullRequest(token,owner,repo,id,{baseRefSha:p.baseRefSha});
                  report.cleanup["profile-"+id]=Boolean(r.pullRequest?.merged);
                }
              } catch(e) {}
            }

            if (builderId) {
              try {
                const b=await client.getBuilderRun(token,owner,repo,builderId);
                if (active.has(b.status)) await client.cancelBuilderRun(token,owner,repo,builderId);
              } catch(e) {}
            }
            try {
              const ps=await client.listProfiles(token,owner,repo);
              report.finalState={baseline:ps.find((p)=>p.baseline)?.id||"",
                profiles:ps.map((p)=>({id:p.id,baseline:p.baseline}))};
            } catch(e) { report.finalStateError=err(e); }
            report.finishedAt=new Date().toISOString();
            fs.writeFileSync("/tmp/e2e-report.json",JSON.stringify(report,null,2)+"\n");
            console.log(JSON.stringify(report,null,2));
          }
          NODE

      - name: Save report and self-clean
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .openwrt-ng
          cp /tmp/e2e-report.json .openwrt-ng/e2e-validation-report.json
          git rm .github/workflows/temp-control-plane-e2e.yml
          git add .openwrt-ng/e2e-validation-report.json
          git commit -m "test: record Control Plane E2E validation and remove helper"
          git push origin HEAD:main
