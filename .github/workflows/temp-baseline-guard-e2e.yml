name: Temporary Baseline Guard E2E
on:
  push:
    branches: [main]
    paths: [".github/workflows/temp-baseline-guard-e2e.yml"]
permissions:
  contents: write
  pull-requests: write
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - working-directory: control-plane
        run: npm ci --ignore-scripts
      - name: Verify protected baseline cannot be deleted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { GitHubAppClient } from "./control-plane/lib/github.mjs";
          const c=new GitHubAppClient({clientId:"e2e",clientSecret:"e2e",redirectUri:"https://invalid.local/",profileMergePolicy:"immediate"});
          const p=await c.getProfile(process.env.GH_TOKEN,"wekingchen","Actions-OpenWrt-NG-Test","e2e-renamed-1005");
          if (!p.profile.baseline) throw new Error("target is not baseline");
          try {
            await c.deleteProfilePullRequest(process.env.GH_TOKEN,"wekingchen","Actions-OpenWrt-NG-Test","e2e-renamed-1005",{baseRefSha:p.baseRefSha});
          } catch(e) {
            if (e?.code==="protected_profile") {
              console.log("E2E_PROTECTED_DELETE=PASS");
              process.exit(0);
            }
            throw e;
          }
          throw new Error("protected profile deletion unexpectedly accepted");
          NODE
      - name: Self clean
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/temp-baseline-guard-e2e.yml
          git commit -m "chore: remove temporary baseline guard E2E helper"
          git push origin HEAD:main
