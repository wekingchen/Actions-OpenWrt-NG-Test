name: Verify gl-mt3600be on Ubuntu 24.04

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-gl-mt3600be-ubuntu24-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: 触发 gl-mt3600be 完整构建
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api             -X POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/build-openwrt.yml/dispatches"             --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "profile": "gl-mt3600be",
              "publish_release": "false",
              "control_plane_request_id": "gnfix24"
            }
          }
          JSON

      - name: 删除已合并修复分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api -X DELETE             "repos/${GITHUB_REPOSITORY}/git/refs/heads/fix/builder-ubuntu24"             --silent || true

      - name: 检出 main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 删除一次性验证 Workflow
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/verify-gl-mt3600be-ubuntu24-once.yml"
          git commit -m "chore: remove Ubuntu 24.04 verification helper"
          git push origin HEAD:main
