name: Verify Config Studio runtime sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-runtime-sync-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: 重跑失败的 Config Studio catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api             -X POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/config-studio.yml/dispatches"             --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "mode": "catalog",
              "request_id": "6ded1a85bf2c4d67",
              "session_branch": "openwrt-ng/config-session-6ded1a85bf2c4d67"
            }
          }
          JSON

      - name: 删除已合并修复分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api -X DELETE             "repos/${GITHUB_REPOSITORY}/git/refs/heads/fix/runtime-sync-entrypoints"             --silent || true

      - name: 检出 main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 删除一次性验证 Workflow
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/verify-runtime-sync-once.yml"
          git commit -m "chore: remove runtime sync verification helper"
          git push origin HEAD:main
