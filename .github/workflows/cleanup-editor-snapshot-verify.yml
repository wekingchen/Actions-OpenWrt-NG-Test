name: Cleanup editor snapshot verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-editor-snapshot-verify.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: 删除验证 Session 分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api -X DELETE             "repos/${GITHUB_REPOSITORY}/git/refs/heads/openwrt-ng/config-session-0210ed17aabbcc01"             --silent || true

      - name: 检出 main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 删除一次性清理 Workflow
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/cleanup-editor-snapshot-verify.yml"
          git commit -m "chore: remove editor snapshot cleanup helper"
          git push origin HEAD:main
