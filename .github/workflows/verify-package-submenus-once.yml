name: Verify Config Studio package submenus

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-package-submenus-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: 触发真实 Config Studio catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api             -X POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/config-studio.yml/dispatches"             --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "mode": "catalog",
              "request_id": "0200a11ce0000001",
              "session_branch": "openwrt-ng/config-session-0200a11ce0000001"
            }
          }
          JSON

      - name: 检出 main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 删除一次性验证 Workflow
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/verify-package-submenus-once.yml"
          git commit -m "chore: remove package submenu verification helper"
          git push origin HEAD:main
